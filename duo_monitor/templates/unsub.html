<!doctype html>
<html $attrs>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>$title · GetDuoNow</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f5f5f2; --card:rgba(255,255,255,.78); --ink:#1d1d1f; --mute:#6e6e73; --faint:#a1a1a6; --line:#e3e2dd;
          --ok:#2f7a55; --sel:#1d1d1f; --sel-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0f17; --card:rgba(255,255,255,.06); --ink:#f4f6fa; --mute:#a3a8b3;
          --faint:#6b7180; --line:rgba(255,255,255,.12); --ok:#9fdcb9; --sel:#f4f6fa; --sel-ink:#0b0f17; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:620px; margin:0 auto; padding:20px 16px 72px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
  .brand { font-weight:700; letter-spacing:-0.02em; font-size:19px; color:inherit; text-decoration:none; }
  .langsel { font:inherit; font-size:14px; color:inherit; background:transparent; border:1px solid var(--line); border-radius:999px; padding:6px 10px; max-width:150px; }
  .card { background:var(--card); backdrop-filter:blur(20px); border:1px solid var(--line); border-radius:22px; padding:22px 18px; }
  h1 { font-size:30px; line-height:1.1; letter-spacing:-0.03em; margin:0 0 10px; font-weight:700; }
  p { color:var(--mute); margin:0 0 18px; font-size:17px; }
  .btn { width:100%; border:0; border-radius:14px; padding:15px; background:var(--sel); color:var(--sel-ink); font:inherit; font-size:17px; font-weight:600; cursor:pointer; }
  .again { color:var(--ok); font-weight:600; text-decoration:none; }
  .fine { color:var(--faint); font-size:12.5px; margin-top:14px; }
</style>
</head>
<body>
<main>
  <div class="top"><a class="brand" href="/">GetDuoNow</a>$switcher</div>
  <div class="card">
    <h1>$title</h1>
    <p>$body</p>
    $form$again
  </div>
  <div class="fine">GetDuoNow · $fine</div>
</main>
</body>
</html>
